fore" alt="Website before changes"></a></figure><figure><figcaption>After</figcaption><a id="after-link"><img id="after" alt="Website after changes"></a></figure></main><script>const page=document.getElementById('page'),width=document.getElementById('width');function update(){const file=page.value+'-'+width.value+'.png';for(const side of ['before','after']){const src=side==='before'?'../audit-2026-10-16/screenshots/'+file:'screenshots/'+file;document.getElementById(side).src=src;document.getElementById(side).alt=page.options[page.selectedIndex].text+' '+side+' at '+width.value+' pixels';document.getElementById(side+'-link').href=src;}}page.addEventListener('change',update);width.addEventListener('change',update);update();</script></html>
