name: Verify source
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  web-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm ci --ignore-scripts
        working-directory: api
      - run: npm run test && npm run test:identity && npm run build && npm audit --omit=dev --audit-level=high
        working-directory: web
      - run: npm test && npm audit --omit=dev --audit-level=high
        working-directory: api
      - run: python3 scripts/recovery_bundle_test.py && python3 scripts/native_release_guard_test.py
  firestore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - run: npm ci --ignore-scripts
        working-directory: firebase
      - run: npm ci --ignore-scripts
        working-directory: api
      - name: Rules and real adapter transactions on local demo emulator
        run: npx --yes firebase-tools@15.32.0 emulators:exec --only firestore --project demo-verification --config firebase/firebase.demo.json 'npm --prefix firebase test && npm --prefix api test -- test/adapters'
  flutter:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.44.8', channel: stable}
      - run: flutter pub get && flutter analyze && flutter test
        working-directory: mobile
